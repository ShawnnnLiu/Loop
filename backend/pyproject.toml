[project]
name = "agentic-calendar"
version = "0.1.0"
description = "Deterministic career-preparation orchestration engine (Phase 1: planning core)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Agentic Calendar" }]
dependencies = [
    "anthropic>=0.109.1",
    "cryptography>=43",
    "fastapi>=0.115",
    # Pinned exact: the committed JSON Schemas in /schemas are byte-stable only
    # for this pydantic version, and `make schema-check` enforces that. Bump
    # deliberately (update lock + `make schemas` + retest); see docs/axioms/18.
    "google-api-python-client>=2.197.0",
    "google-auth-oauthlib>=1.4.0",
    "itsdangerous>=2.1",
    "jinja2>=3.1",
    "pydantic==2.13.3",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-xdist>=3.5",
    "ruff>=0.6",
    "mypy>=1.10",
    "import-linter>=2.0",
    "httpx>=0.27",
]

[project.scripts]
agentic-calendar-export-schemas = "agentic_calendar.tools.export_schemas:main"
agentic-calendar-export-sources = "agentic_calendar.tools.export_sources_page:main"
agentic-calendar-visualize = "agentic_calendar.tools.visualize:main"
# show_accountability is deliberately module-only
# (`uv run python -m agentic_calendar.tools.show_accountability`); it is an
# operator replay/debug tool, not an installed entry point.

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_calendar"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "golden: required deterministic golden test cases (docs/golden-test-cases.md)",
    "boundary: enforced architectural boundary checks",
    "subprocess: smoke tests that spawn real subprocesses (excluded from test-fast)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
# Note: ``make typecheck`` only checks ``src/`` (production code).
# Test type-checking is intentionally relaxed and not part of CI.

# The Google API client and auth libraries ship no type stubs (no py.typed);
# their import surface is confined to tools/google_calendar_auth.py plus the
# lazy HttpError translation in calendar_writer/google_adapter.py.
[[tool.mypy.overrides]]
module = [
    "googleapiclient.*",
    "google.*",
    "google_auth_oauthlib.*",
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
