<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agentic Calendar</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 760px;
           margin: 2rem auto; padding: 0 1rem; color: #222; line-height: 1.5; }
    nav { display: flex; justify-content: space-between; align-items: center;
          border-bottom: 1px solid #eee; padding-bottom: .5rem; margin-bottom: 1.5rem; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
    th, td { border: 1px solid #ddd; padding: .4rem .6rem; text-align: left; }
    .hash { font-family: ui-monospace, monospace; font-size: .8rem;
            word-break: break-all; color: #555; background: #f6f6f6; padding: .5rem; }
    .muted { color: #777; }
    .errors { color: #b00020; background: #fff0f0; border: 1px solid #f3c2c2;
              border-radius: 4px; padding: .5rem 1rem; }
    button { cursor: pointer; padding: .4rem .8rem; }
    form.inline { display: inline; }
    fieldset { border: 1px solid #ddd; margin: .5rem 0; }
    label.inline-check { display: inline-block; margin-right: 1rem; }
    input[type="text"], input:not([type]) { min-width: 18rem; }
  </style>
</head>
<body>
  {% if email %}
  <nav>
    <span class="muted">{{ email }}</span>
    <form method="post" action="/ui/logout" class="inline">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button>Log out</button>
    </form>
  </nav>
  {% endif %}
  {% block content %}{% endblock %}
</body>
</html>
