# Tuning file for Agentic Calendar (axiom 07 "Threshold Change Log").
#
# Changes made here are the ONLY supported path for tuning a deterministic
# threshold. Every effective override is journaled to the threshold change
# log (docs/specs/threshold-change-log.schema.md) before anything serves it
# — no silent threshold changes between releases.
#
# To activate an override: uncomment the section header and the field,
# change the value, and uncomment + fill in the two prose fields below.
# Both are REQUIRED whenever at least one override is active.
# All values shown are the current defaults — uncommenting them unchanged
# journals nothing (idempotent re-load). Every default is an uncalibrated
# heuristic prior (axiom 07 "MVP Disclosure").
#
# justification = "why the value moved (1-500 chars)"
# dataset_reference = "what data motivated it, e.g. 'telemetry through 2026-06-10' or 'manual prior'"

