# Fly.io config for the single-instance hosted app. Lives at the REPO ROOT so a
# bare deploy works and the build context is the repo root (the image needs
# frontend/ and landing/, siblings of backend/):
#   fly deploy
# With no path arg, the build context is this file's directory (the repo root);
# `dockerfile` below is resolved relative to the same dir, so it points at
# backend/Dockerfile. The Dockerfile's COPY paths (frontend/, backend/, landing/)
# are root-relative and resolve against that context.
# Replace the app name and redirect URI with your own.
#
# IMPORTANT: exactly ONE machine. SQLite + WAL is a one-process store, so do
# not scale past 1 (`fly scale count 1`) and do not add workers.

app = "acme-agentic-cal"          # <-- your app name; domain is <app>.fly.dev
primary_region = "lax"            # <-- a region near your testers

[build]
  dockerfile = "backend/Dockerfile"   # relative to this fly.toml's dir (repo root)

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1        # keep the single machine always on

[mounts]
  source = "data"                 # the volume created with `fly volumes create data`
  destination = "/data"

# Non-secret config. Secrets (APP_SESSION_SECRET, APP_TOKEN_ENCRYPTION_KEY,
# TESTER_ALLOWLIST, ANTHROPIC_API_KEY, GOOGLE_OAUTH_CLIENT_SECRET_JSON) are set
# with `fly secrets set` and injected as env vars at runtime.
[env]
  SHARED_DB_PATH = "/data/app.db"
  APP_HTTPS_ONLY = "1"
  OAUTH_REDIRECT_URI = "https://loop-study.com/auth/callback"
  CANONICAL_HOST = "loop-study.com"  # old fly.dev / www requests 301 here
  # Custom-domain cutover (docs/implementation-plans/completed/loop-recruiter-readiness/02)
  # done 2026-07-19. The old fly.dev redirect URI and authorized domain were
  # removed from the Google OAuth console 2026-07-19 for branding verification;
  # this loop-study.com URI is the only registered redirect.
